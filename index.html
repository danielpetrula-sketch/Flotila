<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garáž & Správa vozidiel</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #22c55e;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        h1 { margin: 0; font-size: 1.8rem; color: var(--accent); }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-secondary { background-color: var(--border); color: var(--text); }

        .alerts-summary {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            border-left: 4px solid var(--warning);
        }

        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .car-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .car-card h2 {
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .ecv-tag {
            background: #000;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
            border: 1px solid #555;
        }

        .expiry-list {
            list-style: none;
            padding: 0;
            margin: 16px 0;
        }

        .expiry-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .bg-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .bg-warning { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        .bg-success { background-color: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }

        /* Modal windows */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            box-sizing: border-box;
        }

        .service-log {
            margin-top: 16px;
            font-size: 0.85rem;
            background: var(--bg);
            padding: 8px;
            border-radius: 4px;
            max-height: 120px;
            overflow-y: auto;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🚗 Moja Garáž</h1>
        <div>
            <button class="btn" onclick="openCarModal()">+ Pridať vozidlo</button>
            <button class="btn btn-secondary" onclick="exportData()">Export</button>
            <button class="btn btn-secondary" onclick="importData()">Import</button>
        </div>
    </header>

    <div id="alertsContainer" class="alerts-summary" style="display: none;">
        <h3 style="margin-top:0; color: var(--warning);">⚠️ Upozornenia na blížiace sa termíny</h3>
        <ul id="alertsList" style="margin:0; padding-left:20px;"></ul>
    </div>

    <div id="carGrid" class="car-grid"></div>
</div>

<!-- Modal na priradenie/úpravu vozidla -->
<div id="carModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Pridať vozidlo</h2>
        <form id="carForm">
            <input type="hidden" id="carId">
            <div class="form-group">
                <label>Názov / Model (napr. Škoda Superb)</label>
                <input type="text" id="carName" required>
            </div>
            <div class="form-group">
                <label>EČV</label>
                <input type="text" id="carEcv" placeholder="AA-123BB">
            </div>
            <div class="form-group">
                <label>Platnosť STK</label>
                <input type="date" id="stkDate">
            </div>
            <div class="form-group">
                <label>Platnosť EK</label>
                <input type="date" id="ekDate">
            </div>
            <div class="form-group">
                <label>Platnosť PZP</label>
                <input type="date" id="pzpDate">
            </div>
            <div class="form-group">
                <label>Platnosť Diaľničnej známky</label>
                <input type="date" id="dzDate">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                <button type="button" class="btn btn-secondary" onclick="closeCarModal()">Zrušiť</button>
                <button type="submit" class="btn">Uložiť</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal na pridanie servisu -->
<div id="serviceModal" class="modal">
    <div class="modal-content">
        <h2>Pridať záznam o servise</h2>
        <form id="serviceForm">
            <input type="hidden" id="serviceCarId">
            <div class="form-group">
                <label>Dátum</label>
                <input type="date" id="serviceDate" required>
            </div>
            <div class="form-group">
                <label>Popis opravy / servisu</label>
                <textarea id="serviceDesc" rows="3" required placeholder="Výmena oleja, filtrov, bŕzd..."></textarea>
            </div>
            <div class="form-group">
                <label>Cena (€)</label>
                <input type="number" id="serviceCost" step="0.01" placeholder="0.00">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                <button type="button" class="btn btn-secondary" onclick="closeServiceModal()">Zrušiť</button>
                <button type="submit" class="btn">Uložiť záznam</button>
            </div>
        </form>
    </div>
</div>

<script>
    let cars = JSON.parse(localStorage.getItem('garage_cars')) || [];

    function saveData() {
        localStorage.setItem('garage_cars', JSON.stringify(cars));
        renderCars();
    }

    function getDaysDiff(dateString) {
        if (!dateString) return null;
        const target = new Date(dateString);
        const today = new Date();
        today.setHours(0,0,0,0);
        target.setHours(0,0,0,0);
        const diffTime = target - today;
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    function getBadge(days) {
        if (days === null) return '<span class="badge btn-secondary">Nezadané</span>';
        if (days < 0) return `<span class="badge bg-danger">Vypršalo (${Math.abs(days)} dň.)</span>`;
        if (days <= 30) return `<span class="badge bg-danger">${days} dní</span>`;
        if (days <= 60) return `<span class="badge bg-warning">${days} dní</span>`;
        return `<span class="badge bg-success">${days} dní</span>`;
    }

    function renderCars() {
        const grid = document.getElementById('carGrid');
        const alertsList = document.getElementById('alertsList');
        const alertsContainer = document.getElementById('alertsContainer');
        
        grid.innerHTML = '';
        alertsList.innerHTML = '';
        let hasAlerts = false;

        cars.forEach((car, index) => {
            const stkDays = getDaysDiff(car.stkDate);
            const ekDays = getDaysDiff(car.ekDate);
            const pzpDays = getDaysDiff(car.pzpDate);
            const dzDays = getDaysDiff(car.dzDate);

            // Kontrola upozornení (< 30 dní)
            const checks = [
                { name: 'STK', days: stkDays },
                { name: 'EK', days: ekDays },
                { name: 'PZP', days: pzpDays },
                { name: 'Diaľničná známka', days: dzDays }
            ];

            checks.forEach(c => {
                if (c.days !== null && c.days <= 30) {
                    hasAlerts = true;
                    const statusText = c.days < 0 ? 'vypršala' : `končí o ${c.days} dní`;
                    alertsList.innerHTML += `<li><b>${car.name} (${car.ecv || 'Bez EČV'})</b>: ${c.name} ${statusText}!</li>`;
                }
            });

            // Vykreslenie karty auta
            const card = document.createElement('div');
            card.className = 'car-card';

            let serviceHistoryHtml = car.services && car.services.length > 0 
                ? car.services.map(s => `<div><b>${s.date}:</b> ${s.desc} (${s.cost ? s.cost + '€' : '-'})</div>`).join('')
                : '<i>Žiadne záznamy</i>';

            card.innerHTML = `
                <h2>
                    ${car.name}
                    ${car.ecv ? `<span class="ecv-tag">${car.ecv}</span>` : ''}
                </h2>
                <ul class="expiry-list">
                    <li class="expiry-item"><span>STK:</span> ${getBadge(stkDays)}</li>
                    <li class="expiry-item"><span>EK:</span> ${getBadge(ekDays)}</li>
                    <li class="expiry-item"><span>PZP:</span> ${getBadge(pzpDays)}</li>
                    <li class="expiry-item"><span>Diaľničná:</span> ${getBadge(dzDays)}</li>
                </ul>
                
                <label><b>História servisu:</b></label>
                <div class="service-log">${serviceHistoryHtml}</div>

                <div class="actions">
                    <button class="btn btn-secondary" onclick="openServiceModal(${index})" style="flex:1">+ Servis</button>
                    <button class="btn btn-secondary" onclick="editCar(${index})">Upraviť</button>
                    <button class="btn btn-danger" onclick="deleteCar(${index})">✕</button>
                </div>
            `;
            grid.appendChild(card);
        });

        alertsContainer.style.display = hasAlerts ? 'block' : 'none';
    }

    // Modal logika - Vozidlo
    function openCarModal(editIndex = null) {
        const modal = document.getElementById('carModal');
        const form = document.getElementById('carForm');
        form.reset();

        if (editIndex !== null) {
            const car = cars[editIndex];
            document.getElementById('carId').value = editIndex;
            document.getElementById('carName').value = car.name;
            document.getElementById('carEcv').value = car.ecv || '';
            document.getElementById('stkDate').value = car.stkDate || '';
            document.getElementById('ekDate').value = car.ekDate || '';
            document.getElementById('pzpDate').value = car.pzpDate || '';
            document.getElementById('dzDate').value = car.dzDate || '';
            document.getElementById('modalTitle').innerText = 'Upraviť vozidlo';
        } else {
            document.getElementById('carId').value = '';
            document.getElementById('modalTitle').innerText = 'Pridať vozidlo';
        }

        modal.style.display = 'flex';
    }

    function closeCarModal() {
        document.getElementById('carModal').style.display = 'none';
    }

    document.getElementById('carForm').onsubmit = function(e) {
        e.preventDefault();
        const id = document.getElementById('carId').value;
        const carData = {
            name: document.getElementById('carName').value,
            ecv: document.getElementById('carEcv').value.toUpperCase(),
            stkDate: document.getElementById('stkDate').value,
            ekDate: document.getElementById('ekDate').value,
            pzpDate: document.getElementById('pzpDate').value,
            dzDate: document.getElementById('dzDate').value,
            services: id !== '' ? cars[id].services || [] : []
        };

        if (id !== '') {
            cars[id] = carData;
        } else {
            cars.push(carData);
        }

        saveData();
        closeCarModal();
    };

    function editCar(index) { openCarModal(index); }
    
    function deleteCar(index) {
        if (confirm('Naozaj chceš vymazať toto vozidlo?')) {
            cars.splice(index, 1);
            saveData();
        }
    }

    // Modal logika - Servis
    function openServiceModal(carIndex) {
        document.getElementById('serviceForm').reset();
        document.getElementById('serviceCarId').value = carIndex;
        document.getElementById('serviceDate').valueAsDate = new Date();
        document.getElementById('serviceModal').style.display = 'flex';
    }

    function closeServiceModal() {
        document.getElementById('serviceModal').style.display = 'none';
    }

    document.getElementById('serviceForm').onsubmit = function(e) {
        e.preventDefault();
        const carIndex = document.getElementById('serviceCarId').value;
        const serviceData = {
            date: document.getElementById('serviceDate').value,
            desc: document.getElementById('serviceDesc').value,
            cost: document.getElementById('serviceCost').value
        };

        if (!cars[carIndex].services) cars[carIndex].services = [];
        cars[carIndex].services.unshift(serviceData); // najnovšie hore

        saveData();
        closeServiceModal();
    };

    // Zálohovanie
    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cars));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `garaz_zaloha_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.readAsText(file, 'UTF-8');
            reader.onload = readerEvent => {
                try {
                    cars = JSON.parse(readerEvent.target.result);
                    saveData();
                    alert('Dáta boli úspešne importované!');
                } catch (err) {
                    alert('Chyba pri čítaní súboru.');
                }
            }
        }
        input.click();
    }

    // Prvé vykreslenie
    renderCars();
</script>

</body>
</html>
